global:
  scrape_interval: 5s # Recolectar datos cada 5 segundos
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'restohub-gateway'
    static_configs:
      - targets: ['restohub-gateway:4099']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
