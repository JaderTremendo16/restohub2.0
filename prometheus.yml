global:
  scrape_interval: 5s # Recolectar datos cada 5 segundos
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'restohub-gateway'
    static_configs:
      - targets: ['restohub-gateway:4099']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'ingredients-service'
    static_configs:
      - targets: ['restohub-ingredients-service:4011']

  - job_name: 'menu-service'
    static_configs:
      - targets: ['restohub-menu-service:4012']

  - job_name: 'inventory-service'
    static_configs:
      - targets: ['restohub-inventory-service:4013']

  - job_name: 'location-service'
    static_configs:
      - targets: ['location_service:4015']

  - job_name: 'staff-subgraph'
    static_configs:
      - targets: ['restohub-staff-subgraph:4016']

  - job_name: 'orders-service'
    static_configs:
      - targets: ['restohub-orders-service:3011']

  - job_name: 'kitchen-service'
    static_configs:
      - targets: ['restohub-kitchen-service:3012']

  - job_name: 'pos-service'
    static_configs:
      - targets: ['restohub-pos-service:3014']

  - job_name: 'customer-service'
    static_configs:
      - targets: ['restohub-customer-service:8000']

  - job_name: 'loyalty-service'
    static_configs:
      - targets: ['restohub-loyalty-service:8001']
